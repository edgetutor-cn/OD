<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OD 预习 · Oxford Discover</title>
<style>
  :root{
    --navy:#1A237E; --gold:#FFB800; --orange:#FF6A3D; --cyan:#36C5D6;
    --bg:#f4f6fb; --card:#fff; --ink:#1a2233; --muted:#7a869a; --line:#e6eaf2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  /* 密码门 */
  #gate{position:fixed;inset:0;background:linear-gradient(160deg,#1A237E,#36C5D6);display:flex;align-items:center;justify-content:center;z-index:99}
  #gate .box{background:#fff;border-radius:18px;padding:34px 28px;width:86%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  #gate h2{margin:0 0 6px;color:var(--navy);font-size:22px}
  #gate p{margin:0 0 18px;color:var(--muted);font-size:14px}
  #gate input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font-size:16px;text-align:center;margin-bottom:12px;outline:none}
  #gate input:focus{border-color:var(--cyan)}
  #gate button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  #gate .err{color:#e23c3c;font-size:13px;min-height:18px;margin-top:8px}
  /* 顶栏 */
  .top{background:linear-gradient(120deg,var(--navy),#2a359e);color:#fff;padding:18px 16px 14px}
  .top .t1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  .top .t1 .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
  .top .t2{font-size:13px;opacity:.8;margin-top:3px}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer;margin:12px 16px 0;background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:10px}
  .wrap{padding:14px 14px 40px;max-width:960px;margin:0 auto}
  /* 级别网格 */
  .levels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
  .lvl{background:var(--card);border-radius:16px;padding:18px 14px;text-align:center;box-shadow:0 4px 16px rgba(26,35,126,.06);cursor:pointer;border:2px solid transparent;transition:.15s}
  .lvl:active{transform:scale(.97)}
  .lvl .badge{font-size:30px;font-weight:800;color:var(--navy)}
  .lvl .nm{font-size:14px;margin-top:4px;color:var(--ink);font-weight:600}
  .lvl .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .lvl.od2{border-color:var(--gold)}
  .lvl .tag{display:inline-block;margin-top:7px;font-size:11px;background:#fff3d6;color:#9a6b00;padding:2px 8px;border-radius:20px}
  /* 单元网格 */
  .units{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .unit{background:var(--card);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 3px 12px rgba(26,35,126,.06);cursor:pointer;border:1px solid var(--line)}
  .unit:active{transform:scale(.97)}
  .unit .un{font-size:15px;font-weight:700;color:var(--navy)}
  .unit .cnt{font-size:11px;color:var(--muted);margin-top:3px}
  /* 单元详情 */
  .head{font-size:17px;font-weight:700;color:var(--navy);margin:18px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
  .chip{background:linear-gradient(135deg,#eef1ff,#e6f7fb);border:1px solid #d8e0ff;color:var(--navy);padding:9px 13px;border-radius:22px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip .sp{font-size:12px;opacity:.55}
  .chip:active{transform:scale(.95)}
  .gram{background:#f0f4ff;border-left:4px solid var(--cyan);padding:10px 12px;border-radius:8px;margin-top:8px;font-size:14px;color:#33405e}
  .gram b{color:var(--navy)}
  /* 图片网格 */
  .imgs{columns:2;column-gap:8px;margin-top:12px}
  .imgs img{width:100%;border-radius:10px;margin-bottom:8px;background:#eef;box-shadow:0 2px 8px rgba(0,0,0,.08);break-inside:avoid;display:block}
  .sec{margin-top:20px}
  .sec .sec-t{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .loading{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2>OD 预习</h2>
    <p>请输入课程密码进入</p>
    <input id="pw" type="password" placeholder="密码" autocomplete="off">
    <button id="go">进入</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="top" id="top" style="display:none">
  <div class="t1"><span class="dot"></span>OD 预习 · Oxford Discover</div>
  <div class="t2">课前预习 · 核心词汇 / 实用句型 / 教材原页</div>
</div>
<div id="app"></div>

<script>
/* ===== 密码门（FNV-1a，密码 666 → 8aaae501） ===== */
(function(){
  const KEY='edge_gate_od_v1', PWHASH='8aaae501';
  function fnv1a(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16).padStart(8,'0');}
  window.Gate={
    check(){try{return localStorage.getItem(KEY)==='1';}catch(e){return false;}},
    tryOpen(pw){if(fnv1a(pw)===PWHASH){localStorage.setItem(KEY,'1');return true;}return false;}
  };
})();

/* ===== 发音（Web Speech API） ===== */
let EN_VOICE=null;
function loadVoices(){const vs=speechSynthesis.getVoices();EN_VOICE=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'))||null;}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(w){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.9;if(EN_VOICE)u.voice=EN_VOICE;
  speechSynthesis.speak(u);
}

/* ===== 数据 ===== */
const LEVELS=[
  {id:'OD1',name:'Oxford Discover 1',sub:'扫描教材·原页预览'},
  {id:'OD2',name:'Oxford Discover 2',sub:'结构化预习·词汇+句型',od2:true},
  {id:'OD3',name:'Oxford Discover 3',sub:'扫描教材·原页预览'},
  {id:'OD4',name:'Oxford Discover 4',sub:'扫描教材·原页预览'},
  {id:'OD5',name:'Oxford Discover 5',sub:'扫描教材·原页预览'},
  {id:'OD6',name:'Oxford Discover 6',sub:'扫描教材·原页预览'},
];
let OD2=null, PAGES=null;

/* 懒加载图片 */
function setupLazy(root){
  const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){const img=e.target;if(img.dataset.src){img.src=img.dataset.src;io.unobserve(img);}}});},{rootMargin:'200px'});
  root.querySelectorAll('img[data-src]').forEach(img=>io.observe(img));
}
function imgGrid(files,lv){
  if(!files||!files.length)return '<div class="loading">暂无页面图片</div>';
  return '<div class="imgs">'+files.map(f=>`<img data-src="od_img/${lv}/${f}" loading="lazy" alt="page">`).join('')+'</div>';
}

/* ===== 视图 ===== */
const app=document.getElementById('app');
function showLevels(){
  document.getElementById('top').style.display='block';
  let h='<div class="wrap"><div class="levels">';
  LEVELS.forEach(L=>{
    h+=`<div class="lvl ${L.od2?'od2':''}" onclick="openLevel('${L.id}')">
      <div class="badge">${L.id}</div><div class="nm">${L.name}</div><div class="sub">${L.sub}</div>
      ${L.od2?'<span class="tag">含词汇预习</span>':''}</div>`;
  });
  h+='</div>';
  if(!PAGES)h+='<div class="loading">数据加载中…</div>';
  h+='<div class="hint" style="margin-top:18px">提示：OD2 已做结构化词汇+句型预习；OD1/3/4/5/6 为教材原页图片预览（课前翻看）。点击单词可听英文发音。</div></div>';
  app.innerHTML=h;
}
function openLevel(lv){
  const L=LEVELS.find(x=>x.id===lv);
  if(lv==='OD2'&&OD2){
    let h=`<div class="back" onclick="showLevels()">← 返回级别</div><div class="wrap">`;
    h+=`<div class="head">${L.name} · 单元预习（共 ${OD2.length} 个单元）</div>`;
    h+='<div class="units">';
    OD2.forEach((u,i)=>{h+=`<div class="unit" onclick="openUnit(${i})"><div class="un">Unit ${u.unit}</div><div class="cnt">${u.vocab.length} 词 · 点击预习</div></div>`;});
    h+='</div></div>';
    app.innerHTML=h;
    return;
  }
  // 其余级别：页图预览
  const files=PAGES?PAGES[lv]:null;
  let h=`<div class="back" onclick="showLevels()">← 返回级别</div><div class="wrap">`;
  h+=`<div class="head">${L.name} · 教材原页预览</div>`;
  h+='<div class="hint">扫描版教材，逐页浏览即可课前预习。共 '+(files?files.length:0)+' 页。</div>';
  h+=imgGrid(files,lv);
  h+='</div>';
  app.innerHTML=h;setupLazy(app);
}
function openUnit(i){
  const u=OD2[i];
  let h=`<div class="back" onclick="openLevel('OD2')">← 返回单元</div><div class="wrap">`;
  h+=`<div class="head">Unit ${u.unit} · 核心词汇</div>`;
  if(u.vocab.length){
    h+='<div class="chips">';
    u.vocab.forEach(w=>{h+=`<div class="chip" onclick="speak('${w.replace(/'/g,"\\'")}')">${w}<span class="sp">🔊</span></div>`;});
    h+='</div>';
  }else h+='<div class="loading">本单元未提取到词汇</div>';
  if(u.grammar&&u.grammar.length){
    h+='<div class="sec"><div class="sec-t">📘 语法句型</div>';
    u.grammar.forEach(g=>{h+=`<div class="gram"><b>${g}</b></div>`;});
    h+='</div>';
  }
  // 教材原页（OD2 全部页）
  const files=PAGES?PAGES['OD2']:null;
  h+='<div class="sec"><div class="sec-t">📄 教材原页（Unit '+u.unit+'）</div>';
  h+=imgGrid(files,'OD2')+'</div>';
  h+='</div>';
  app.innerHTML=h;setupLazy(app);
}

/* ===== 启动 ===== */
function boot(){
  if(!Gate.check()){document.getElementById('gate').style.display='flex';return;}
  document.getElementById('gate').style.display='none';
  Promise.all([
    fetch('data/od2.json').then(r=>r.ok?r.json():null).catch(()=>null),
    fetch('data/pages.json').then(r=>r.ok?r.json():null).catch(()=>null)
  ]).then(([a,b])=>{OD2=a;PAGES=b;showLevels();});
}
document.getElementById('go').onclick=function(){
  const v=document.getElementById('pw').value;
  if(Gate.tryOpen(v)){document.getElementById('gate').style.display='none';boot();}
  else{document.getElementById('err').textContent='密码错误，请找课程老师获取密码';}
};
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
// 已解锁则直接进
if(Gate.check())boot();
</script>
</body>
</html>
